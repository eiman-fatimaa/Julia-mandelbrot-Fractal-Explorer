<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Spiral Fractal Explorer</title>
<style>
  :root{
    --bg:#07050d; --panel:#100c1c; --line:#241d38; --text:#cfc8e6; --muted:#7c7396;
    --accent:#8f6bff; --accent2:#00c2c2;
  }
  * { box-sizing: border-box; }
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family: 'Courier New', monospace;
    min-height:100vh; display:flex; align-items:flex-start; justify-content:center;
  }
  .app{
    display:flex; gap:20px; padding:28px; flex-wrap:wrap; justify-content:center; max-width:1180px;
  }
  .stage{ position:relative; }
  canvas{
    display:block; width:min(88vw,720px); height:min(88vw,720px);
    background:#000; border-radius:10px; box-shadow:0 0 60px rgba(143,107,255,0.28);
    cursor:grab; touch-action:none;
  }
  canvas.dragging{ cursor:grabbing; }
  .progress-wrap{
    position:absolute; left:0; right:0; bottom:0; height:3px; background:transparent; overflow:hidden; border-radius:0 0 10px 10px;
  }
  .progress-bar{ height:100%; width:0%; background:linear-gradient(90deg,var(--accent2),var(--accent)); transition:width .08s linear; }
  .status{ font-size:12px; color:var(--muted); margin-top:10px; min-height:16px; }
  .hint{ font-size:11px; color:var(--muted); margin-top:2px; }

  .panel{
    width:300px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:18px;
    display:flex; flex-direction:column; gap:16px;
  }
  .panel h1{ font-size:15px; margin:0 0 2px; color:#fff; font-weight:600; }
  .panel .sub{ font-size:11.5px; color:var(--muted); margin:0 0 6px; line-height:1.5; }
  .row{ display:flex; flex-direction:column; gap:6px; }
  .row label{ font-size:11px; color:var(--muted); letter-spacing:.02em; }
  .seg{ display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .seg button{
    flex:1; background:transparent; border:none; color:var(--muted); padding:8px 6px; font-family:inherit;
    font-size:12px; cursor:pointer;
  }
  .seg button.active{ background:var(--accent); color:#0a0715; font-weight:600; }
  select, input[type=range]{
    width:100%; background:#0c0918; border:1px solid var(--line); color:var(--text);
    border-radius:6px; padding:6px; font-family:inherit; font-size:12px;
  }
  .presets{ display:flex; flex-wrap:wrap; gap:6px; }
  .presets button{
    background:#0c0918; border:1px solid var(--line); color:var(--text); border-radius:7px;
    padding:6px 9px; font-size:11px; font-family:inherit; cursor:pointer;
  }
  .presets button:hover{ border-color:var(--accent); color:#fff; }
  .valline{ display:flex; justify-content:space-between; font-size:11px; color:var(--muted); }
  .btn-main{
    background:linear-gradient(90deg,var(--accent2),var(--accent)); border:none; color:#0a0715;
    font-weight:700; padding:10px; border-radius:8px; cursor:pointer; font-family:inherit; font-size:12.5px;
  }
  .btn-ghost{
    background:transparent; border:1px solid var(--line); color:var(--text); padding:9px; border-radius:8px;
    cursor:pointer; font-family:inherit; font-size:12px;
  }
  .btn-ghost:hover{ border-color:var(--accent2); }
</style>
</head>
<body>
<div class="app">

  <div>
    <div class="stage">
      <canvas id="fractal" width="720" height="720"></canvas>
      <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
    </div>
    <div class="status" id="status">ready.</div>
    <div class="hint">scroll / pinch to zoom toward cursor &middot; drag to pan</div>
  </div>

  <div class="panel">
    <div>
      <h1>Spiral Fractal Explorer</h1>
      <p class="sub">Escape-time Mandelbrot / Julia renderer with smooth iteration + stripe-average shading &mdash; the technique behind that fibrous, spiral fractal-art look. Zoom into any boundary to find your own spirals.</p>
    </div>

    <div class="row">
      <label>SET TYPE</label>
      <div class="seg">
        <button id="modeMandel" class="active">Mandelbrot</button>
        <button id="modeJulia">Julia</button>
      </div>
    </div>

    <div class="row">
      <label id="presetLabel">SPIRAL PRESETS</label>
      <div class="presets" id="presets"></div>
    </div>

    <div class="row">
      <label>PALETTE</label>
      <select id="palette"></select>
    </div>

    <div class="row">
      <label>TEXTURE (stripe mix) &mdash; <span id="mixVal"></span></label>
      <input type="range" id="mix" min="0" max="100" value="55">
    </div>

    <div class="row">
      <label>STRIPE DENSITY &mdash; <span id="stripeVal"></span></label>
      <input type="range" id="stripe" min="1" max="16" value="5">
    </div>

    <div class="valline">
      <span id="zoomLabel">zoom 1&times;</span>
      <span id="iterLabel">iter 150</span>
    </div>

    <button class="btn-ghost" id="resetBtn">Reset view</button>
    <button class="btn-ghost" id="randomBtn">Randomize spiral</button>
    <button class="btn-main" id="exportBtn">Download high-res PNG</button>
  </div>

</div>

<script>
const canvas = document.getElementById('fractal');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ---------- palettes ----------
const palettes = {
  tealGold: {
    label: 'Teal & Gold',
    inSet: [5,3,14],
    stops: [
      [0.00,[8,4,18]], [0.14,[46,16,74]], [0.32,[122,34,158]],
      [0.48,[0,148,168]], [0.64,[0,196,190]], [0.80,[244,176,64]],
      [0.92,[255,224,150]], [1.00,[8,4,18]]
    ]
  },
  emberIce: {
    label: 'Ember & Ice',
    inSet: [10,3,3],
    stops: [
      [0.00,[12,2,4]], [0.18,[96,10,14]], [0.36,[230,86,12]],
      [0.52,[255,188,60]], [0.66,[70,206,214]], [0.82,[36,70,150]],
      [0.94,[150,60,190]], [1.00,[12,2,4]]
    ]
  },
  neonFilaments: {
    label: 'Neon Filaments',
    inSet: [0,0,0],
    stops: [
      [0.00,[0,0,0]], [0.12,[220,30,90]], [0.28,[255,170,20]],
      [0.44,[110,230,70]], [0.58,[30,190,230]], [0.74,[70,90,255]],
      [0.88,[190,60,255]], [1.00,[0,0,0]]
    ]
  },
  roseSpiral: {
    label: 'Rose Spiral',
    inSet: [8,3,10],
    stops: [
      [0.00,[10,3,15]], [0.20,[120,40,90]], [0.40,[196,92,132]],
      [0.55,[40,170,180]], [0.72,[10,110,132]], [0.88,[224,182,112]],
      [1.00,[10,3,15]]
    ]
  },
  auroraDark: {
    label: 'Aurora Dark',
    inSet: [3,4,12],
    stops: [
      [0.00,[3,4,12]], [0.25,[10,50,70]], [0.45,[24,140,150]],
      [0.60,[150,70,210]], [0.80,[235,90,160]], [1.00,[3,4,12]]
    ]
  }
};

function sample(stops, t){
  t = ((t % 1) + 1) % 1;
  for(let i=0;i<stops.length-1;i++){
    const [t0,c0] = stops[i], [t1,c1] = stops[i+1];
    if(t>=t0 && t<=t1){
      const f = (t1-t0) ? (t-t0)/(t1-t0) : 0;
      return [c0[0]+(c1[0]-c0[0])*f, c0[1]+(c1[1]-c0[1])*f, c0[2]+(c1[2]-c0[2])*f];
    }
  }
  return stops[stops.length-1][1];
}

function colorizeInto(imageData, values, w, h, paletteName, phase){
  const pal = palettes[paletteName];
  const stops = pal.stops, inSet = pal.inSet;
  const data = imageData.data;
  for(let i=0;i<w*h;i++){
    const v = values[i];
    let r,g,b;
    if(v < 0){ r=inSet[0]; g=inSet[1]; b=inSet[2]; }
    else {
      const t = v + phase;
      const c = sample(stops, t);
      r=c[0]; g=c[1]; b=c[2];
    }
    const o=i*4;
    data[o]=r; data[o+1]=g; data[o+2]=b; data[o+3]=255;
  }
}

// ---------- fractal state ----------
let mode = 'mandelbrot';
let centerX = -0.5, centerY = 0, viewScale = 1.6;
let juliaC = { re:-0.8, im:0.156 };
let paletteName = 'tealGold';
let stripeDensity = 5;
let stripeMix = 0.55;
let currentValues = null;
let rendering = false;
let pendingRerender = false;
let animPhase = 0;
const mainImageData = ctx.createImageData(W,H);

function computeMaxIter(scale){
  return Math.min(3200, Math.floor(160 + 85*Math.log2(1.6/scale + 1)));
}

async function renderFractal({w,h,mode,centerX,centerY,viewScale,juliaC,stripeDensity,stripeMix,maxIterOverride,onProgress}){
  const maxIter = maxIterOverride || computeMaxIter(viewScale);
  const values = new Float32Array(w*h);
  const bail = 1e4;
  const rowsPerChunk = Math.max(1, Math.floor(24000 / w));
  for(let py=0; py<h; py++){
    const ci0 = centerY + (py - h/2) * (viewScale*2/h);
    for(let px=0; px<w; px++){
      let zr, zi, cr, ci;
      if(mode === 'mandelbrot'){
        cr = centerX + (px - w/2) * (viewScale*2/w);
        ci = ci0;
        zr = 0; zi = 0;
      } else {
        zr = centerX + (px - w/2) * (viewScale*2/w);
        zi = ci0;
        cr = juliaC.re; ci = juliaC.im;
      }
      let zr2 = zr*zr, zi2 = zi*zi;
      let n = 0, stripeSum = 0, stripeCount = 0;
      while(zr2 + zi2 <= bail && n < maxIter){
        zi = 2*zr*zi + ci;
        zr = zr2 - zi2 + cr;
        zr2 = zr*zr; zi2 = zi*zi;
        if(n > 2){
          const angle = Math.atan2(zi, zr);
          stripeSum += (Math.sin(stripeDensity*angle) + 1) * 0.5;
          stripeCount++;
        }
        n++;
      }
      const idx = py*w+px;
      if(n >= maxIter){
        values[idx] = -1;
      } else {
        const logZn = Math.log(zr2+zi2) / 2;
        const nu = Math.log(logZn/Math.LN2) / Math.LN2;
        const smoothN = (n + 1 - nu) / maxIter;
        const stripeAvg = stripeCount > 0 ? stripeSum/stripeCount : 0.5;
        let val = stripeAvg*stripeMix + smoothN*(1-stripeMix)*4.0;
        values[idx] = ((val % 1) + 1) % 1;
      }
    }
    if(py % rowsPerChunk === 0){
      if(onProgress) onProgress(py/h);
      await new Promise(r => setTimeout(r, 0));
    }
  }
  if(onProgress) onProgress(1);
  return values;
}

// ---------- UI wiring ----------
const statusEl = document.getElementById('status');
const progressBar = document.getElementById('progressBar');
const zoomLabel = document.getElementById('zoomLabel');
const iterLabel = document.getElementById('iterLabel');

function fmtZoom(){
  const z = 1.6/viewScale;
  if(z < 1000) return z.toFixed(1)+'\u00d7';
  if(z < 1e6) return (z/1000).toFixed(1)+'k\u00d7';
  return (z/1e6).toFixed(2)+'M\u00d7';
}

async function triggerRender(){
  if(rendering){ pendingRerender = true; return; }
  rendering = true;
  statusEl.textContent = 'rendering...';
  progressBar.style.width = '0%';
  const vals = await renderFractal({
    w:W, h:H, mode, centerX, centerY, viewScale, juliaC,
    stripeDensity, stripeMix,
    onProgress: p => progressBar.style.width = (p*100)+'%'
  });
  currentValues = vals;
  rendering = false;
  progressBar.style.width = '0%';
  zoomLabel.textContent = 'zoom ' + fmtZoom();
  iterLabel.textContent = 'iter ' + computeMaxIter(viewScale);
  statusEl.textContent = 'ready.';
  if(pendingRerender){ pendingRerender = false; triggerRender(); }
}

function animLoop(){
  if(!rendering && currentValues){
    animPhase += 0.0011;
    colorizeInto(mainImageData, currentValues, W, H, paletteName, animPhase);
    ctx.putImageData(mainImageData, 0, 0);
  }
  requestAnimationFrame(animLoop);
}

// ---------- presets ----------
const mandelbrotPresets = [
  {name:'Classic',        cx:-0.5,               cy:0,                scale:1.6},
  {name:'Seahorse Valley',cx:-0.743643887037151, cy:0.131825904205330,scale:0.00009},
  {name:'Spiral Feather', cx:-0.7453,             cy:0.1127,           scale:0.0009},
  {name:'Double Spiral',  cx:-0.7660,             cy:0.0855,           scale:0.0006},
  {name:'Golden Spiral',  cx:-1.2560,             cy:0.0380,           scale:0.0025},
  {name:'Elephant Edge',  cx:0.2929859127507,     cy:0.4879553939341,  scale:0.0004},
];
const juliaPresets = [
  {name:'Dendrite Spiral', re:-0.8,      im:0.156},
  {name:'San Marco Spiral',re:-0.70176,  im:-0.3842},
  {name:'Rabbit Spiral',   re:-0.4,      im:0.6},
  {name:'Siegel Spiral',   re:-0.390541, im:-0.586788},
  {name:'Feather Julia',   re:0.285,     im:0.01},
  {name:'Storm Spiral',    re:-0.835,    im:-0.2321},
];

const presetsEl = document.getElementById('presets');
const presetLabel = document.getElementById('presetLabel');

function renderPresetButtons(){
  presetsEl.innerHTML = '';
  const list = mode === 'mandelbrot' ? mandelbrotPresets : juliaPresets;
  presetLabel.textContent = mode === 'mandelbrot' ? 'SPIRAL PRESETS' : 'JULIA CONSTANTS';
  list.forEach(p => {
    const b = document.createElement('button');
    b.textContent = p.name;
    b.onclick = () => {
      if(mode === 'mandelbrot'){
        centerX = p.cx; centerY = p.cy; viewScale = p.scale;
      } else {
        juliaC = { re:p.re, im:p.im };
        centerX = 0; centerY = 0; viewScale = 1.3;
      }
      triggerRender();
    };
    presetsEl.appendChild(b);
  });
}

// mode toggle
const modeMandelBtn = document.getElementById('modeMandel');
const modeJuliaBtn = document.getElementById('modeJulia');
function setMode(m){
  mode = m;
  modeMandelBtn.classList.toggle('active', m === 'mandelbrot');
  modeJuliaBtn.classList.toggle('active', m === 'julia');
  if(m === 'mandelbrot'){ centerX=-0.5; centerY=0; viewScale=1.6; }
  else { centerX=0; centerY=0; viewScale=1.3; }
  renderPresetButtons();
  triggerRender();
}
modeMandelBtn.onclick = () => setMode('mandelbrot');
modeJuliaBtn.onclick = () => setMode('julia');

// palette select
const paletteSel = document.getElementById('palette');
Object.keys(palettes).forEach(key => {
  const opt = document.createElement('option');
  opt.value = key; opt.textContent = palettes[key].label;
  paletteSel.appendChild(opt);
});
paletteSel.value = paletteName;
paletteSel.onchange = () => { paletteName = paletteSel.value; };

// sliders
const mixSlider = document.getElementById('mix');
const mixVal = document.getElementById('mixVal');
const stripeSlider = document.getElementById('stripe');
const stripeVal = document.getElementById('stripeVal');
function syncSliderLabels(){
  mixVal.textContent = mixSlider.value + '%';
  stripeVal.textContent = stripeSlider.value;
}
mixSlider.oninput = () => { stripeMix = mixSlider.value/100; syncSliderLabels(); };
stripeSlider.oninput = () => { stripeDensity = parseFloat(stripeSlider.value); syncSliderLabels(); };
mixSlider.onchange = () => triggerRender();
stripeSlider.onchange = () => triggerRender();
syncSliderLabels();

// reset / random
document.getElementById('resetBtn').onclick = () => {
  if(mode === 'mandelbrot'){ centerX=-0.5; centerY=0; viewScale=1.6; }
  else { centerX=0; centerY=0; viewScale=1.3; }
  triggerRender();
};
document.getElementById('randomBtn').onclick = () => {
  const list = mode === 'mandelbrot' ? mandelbrotPresets : juliaPresets;
  const p = list[Math.floor(Math.random()*list.length)];
  if(mode === 'mandelbrot'){
    const jitter = p.scale * 0.6;
    centerX = p.cx + (Math.random()-0.5)*jitter;
    centerY = p.cy + (Math.random()-0.5)*jitter;
    viewScale = p.scale * (0.5 + Math.random()*0.8);
  } else {
    juliaC = { re:p.re, im:p.im };
    centerX = (Math.random()-0.5)*0.6;
    centerY = (Math.random()-0.5)*0.6;
    viewScale = 0.15 + Math.random()*0.9;
  }
  paletteName = Object.keys(palettes)[Math.floor(Math.random()*Object.keys(palettes).length)];
  paletteSel.value = paletteName;
  triggerRender();
};

// ---------- mouse / touch interaction ----------
let dragging = false, dragStartX=0, dragStartY=0, dragOrigX=0, dragOrigY=0;
let wheelTimer = null;

function screenToCanvasScale(){
  const rect = canvas.getBoundingClientRect();
  return W / rect.width;
}

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const s = screenToCanvasScale();
  const mx = (e.clientX - rect.left) * s;
  const my = (e.clientY - rect.top) * s;
  const factor = e.deltaY < 0 ? 0.82 : 1/0.82;
  const preCr = centerX + (mx - W/2) * (viewScale*2/W);
  const preCi = centerY + (my - H/2) * (viewScale*2/H);
  viewScale *= factor;
  centerX = preCr - (mx - W/2) * (viewScale*2/W);
  centerY = preCi - (my - H/2) * (viewScale*2/H);
  clearTimeout(wheelTimer);
  wheelTimer = setTimeout(triggerRender, 160);
}, { passive:false });

canvas.addEventListener('mousedown', e => {
  dragging = true;
  canvas.classList.add('dragging');
  dragStartX = e.clientX; dragStartY = e.clientY;
  dragOrigX = centerX; dragOrigY = centerY;
});
window.addEventListener('mousemove', e => {
  if(!dragging) return;
  canvas.style.transform = `translate(${e.clientX-dragStartX}px, ${e.clientY-dragStartY}px)`;
});
window.addEventListener('mouseup', e => {
  if(!dragging) return;
  dragging = false;
  canvas.classList.remove('dragging');
  const s = screenToCanvasScale();
  const dxCanvas = (e.clientX - dragStartX) * s;
  const dyCanvas = (e.clientY - dragStartY) * s;
  centerX = dragOrigX - dxCanvas * (viewScale*2/W);
  centerY = dragOrigY - dyCanvas * (viewScale*2/H);
  canvas.style.transform = '';
  triggerRender();
});

// basic touch support
let touchStartDist = null;
canvas.addEventListener('touchstart', e => {
  if(e.touches.length === 1){
    dragging = true;
    dragStartX = e.touches[0].clientX; dragStartY = e.touches[0].clientY;
    dragOrigX = centerX; dragOrigY = centerY;
  } else if(e.touches.length === 2){
    dragging = false;
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    touchStartDist = Math.hypot(dx,dy);
  }
}, {passive:true});
canvas.addEventListener('touchmove', e => {
  if(e.touches.length === 1 && dragging){
    const t = e.touches[0];
    canvas.style.transform = `translate(${t.clientX-dragStartX}px, ${t.clientY-dragStartY}px)`;
  } else if(e.touches.length === 2 && touchStartDist){
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.hypot(dx,dy);
    const factor = touchStartDist / dist;
    viewScale *= factor;
    touchStartDist = dist;
  }
}, {passive:true});
canvas.addEventListener('touchend', e => {
  if(dragging){
    dragging = false;
    const rect = canvas.getBoundingClientRect();
    const s = W/rect.width;
    const style = canvas.style.transform;
    const m = /translate\(([-\d.]+)px, ([-\d.]+)px\)/.exec(style);
    if(m){
      const dxCanvas = parseFloat(m[1]) * s;
      const dyCanvas = parseFloat(m[2]) * s;
      centerX = dragOrigX - dxCanvas * (viewScale*2/W);
      centerY = dragOrigY - dyCanvas * (viewScale*2/H);
    }
    canvas.style.transform = '';
  }
  touchStartDist = null;
  triggerRender();
});

// ---------- export ----------
document.getElementById('exportBtn').onclick = async () => {
  const size = 2000;
  statusEl.textContent = 'rendering high-res \u2014 this can take up to ~20s...';
  progressBar.style.width = '0%';
  const maxIter = Math.min(4200, Math.floor(computeMaxIter(viewScale) * 1.3));
  const vals = await renderFractal({
    w:size, h:size, mode, centerX, centerY, viewScale, juliaC,
    stripeDensity, stripeMix, maxIterOverride: maxIter,
    onProgress: p => { progressBar.style.width = (p*100)+'%'; statusEl.textContent = 'rendering high-res... ' + Math.round(p*100) + '%'; }
  });
  const off = document.createElement('canvas');
  off.width = size; off.height = size;
  const octx = off.getContext('2d');
  const imgData = octx.createImageData(size, size);
  colorizeInto(imgData, vals, size, size, paletteName, animPhase);
  octx.putImageData(imgData, 0, 0);
  const link = document.createElement('a');
  link.download = 'fractal-art-highres.png';
  link.href = off.toDataURL('image/png');
  link.click();
  progressBar.style.width = '0%';
  statusEl.textContent = 'done \u2014 check your downloads.';
};

// ---------- init ----------
renderPresetButtons();
triggerRender();
requestAnimationFrame(animLoop);
</script>
</body>
</html>
